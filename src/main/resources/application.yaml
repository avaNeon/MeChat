server:
  port: 8080
#  address: 0.0.0.0
spring:
  application:
    name: MeChat
  jackson:
    time-zone: Asia/Shanghai # 注意时区
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB
  datasource:
    url: jdbc:mysql://rocky16:3306/MeChat?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      password: redis
      lettuce: #这里的配置都是默认值
        pool:
          max-active: 100 #最大活跃连接数
          max-wait: 2000ms  #连接池中链接耗尽时，最大等待时间。-1ms表示无限等待，直到有连接可用
          max-idle: 50 #连接池最大空闲连接数
          min-idle: 10 #连接池最小空闲连接数
      host: rocky16
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/**.xml
  configuration:
    map-underscore-to-camel-case: true

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.neon.mechat.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

mechat:
  account:
    login-token-ttl: 7d
    login-token-renew-threshold: 1d
  snowflake:
    worker-id: 1
    datacenter-id: 1
